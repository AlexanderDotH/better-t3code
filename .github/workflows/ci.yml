name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          grep -n "__clerk_internal_electron_passkeys" apps/desktop/dist-electron/preload.cjs

  # Everything except `t3` (apps/server). `--parallel` drops the package
  # dependency ordering that `vp run` applies by default: these `test` tasks
  # declare no `dependsOn` and resolve workspace deps from source, so ordering
  # only bought us idle runners between dependency layers. The concurrency
  # limit stays at the default 4 so peak load per runner is unchanged.
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' test

  # apps/server sets `fileParallelism: false`, so its 239 files run strictly
  # one at a time. Sharding spreads them over separate runners instead of
  # separate workers, so no two server test files ever share a machine and the
  # isolation that flag buys is preserved exactly.
  test_server:
    name: Test Server ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # No Electron setup here: `t3` (apps/server) has no Electron dependency
      # and none of its tests touch the runtime. Only the non-server `test`
      # job, which covers @t3tools/desktop, needs the download.
      - name: Test
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
        run: vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      # src/server.test.ts writes the budget report, so exactly one shard
      # produces these files. Gating the upload on their presence keeps a
      # single `thread-transfer-results` artifact per run, which is the name
      # thread-transfer-report.yml resolves.
      - name: Detect transfer budget report
        id: transfer_budget
        if: always()
        run: |
          if test -f "${{ runner.temp }}/thread-transfer-result.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish transfer budget report
        if: always() && steps.transfer_budget.outputs.present == 'true'
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload thread transfer result
        if: always() && steps.transfer_budget.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer-result.json
          if-no-files-found: ignore
          retention-days: 30

  # Split out of Check and Test: both paid ~7-9s to install a Rust toolchain
  # for checks that take under 3s, on the critical path of every PR.
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check resource monitor formatting
        run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check

      - name: Test resource monitor
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

  windows_x64:
    name: Windows 2025 x64 Parity
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+ and Node 24
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Confirm native Windows x64 runtime
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne "Windows" -or (node -p "process.arch") -ne "x64") {
            throw "Windows parity requires a native Windows x64 runner."
          }
          $major = [int](node -p "process.versions.node.split('.')[0]")
          if ($major -ne 24) {
            throw "Windows parity requires Node 24, received $(node --version)."
          }

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Exercise real command shims, PowerShell, ConPTY, Git, and cleanup
        run: node scripts/windows-native-runtime-smoke.mjs

      - name: Test native Windows resource monitor
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

      - name: Test Windows platform contracts
        shell: pwsh
        run: |
          vp test run `
            scripts/windows-smoke-logic.test.mjs `
            packages/shared/src/shell.test.ts `
            packages/shared/src/path.test.ts `
            apps/server/src/processRunner.test.ts `
            apps/server/src/process/OwnedChildProcess.test.ts `
            apps/server/src/cloud/bootService.test.ts `
            apps/server/src/cloud/serviceLauncherClient.test.ts `
            apps/server/src/serviceLauncher.test.ts `
            apps/server/src/resourceTelemetry/NativeTelemetryClient.test.ts `
            apps/server/src/resourceTelemetry/ResourceMonitorBinary.test.ts `
            apps/server/src/resourceProtection/SubagentResourceGovernor.test.ts `
            apps/server/src/terminal/NodePtyAdapter.test.ts `
            apps/server/src/terminal/Manager.test.ts `
            apps/server/src/provider/CodexProcessArgs.test.ts `
            apps/server/src/provider/Drivers/ClaudeExecutable.test.ts `
            apps/server/src/provider/Layers/ProviderRegistry.test.ts `
            apps/server/src/provider/Layers/ProviderAdapterRegistry.test.ts `
            apps/server/src/cli/connect.test.ts `
            apps/server/src/checkpointing/CheckpointStore.test.ts `
            apps/server/src/vcs/GitVcsDriverCore.test.ts `
            apps/desktop/src/app/DesktopConnectionCatalogStore.test.ts `
            apps/desktop/src/backend/DesktopBackendConfiguration.test.ts `
            apps/desktop/src/wsl/DesktopWslEnvironment.test.ts

      - name: Typecheck Windows desktop and server
        shell: pwsh
        run: |
          vp run --filter t3 typecheck
          vp run --filter @t3tools/desktop typecheck

      - name: Build Windows desktop and server pipeline
        run: vp run build:desktop

      - name: Verify Windows preload bundle output
        shell: pwsh
        run: |
          $preload = "apps/desktop/dist-electron/preload.cjs"
          if (-not (Test-Path -LiteralPath $preload -PathType Leaf)) {
            throw "Missing desktop preload bundle: $preload"
          }
          $required = @("desktopBridge", "getLocalEnvironmentBootstrap", "PICK_FOLDER_CHANNEL", "wsUrl")
          foreach ($marker in $required) {
            if (-not (Select-String -LiteralPath $preload -SimpleMatch $marker -Quiet)) {
              throw "Desktop preload bundle is missing '$marker'."
            }
          }

      - name: Exercise installed per-user Task Scheduler service
        shell: pwsh
        run: |
          ./scripts/windows-task-scheduler-service-smoke.ps1 `
            -WorkRoot (Join-Path $env:RUNNER_TEMP "t3-task-scheduler-service-smoke")

  # The static analysis below needs a macOS runner, which bills ~6.7x a Linux
  # minute, so gate it on the native sources it actually lints instead of paying
  # for it on every push. Detection is API-only (no checkout) and fails open: if
  # the diff cannot be resolved, the lint runs.
  mobile_native_changes:
    name: Mobile Native Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      android_changed: ${{ steps.detect.outputs.android_changed }}
    steps:
      - name: Detect mobile native changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail

          fail_open() {
            echo "$* Running native static analysis and the Android build."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "android_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          count_rows() {
            printf '%s\n' "$1" | grep -c . || true
          }

          # One row per changed file, holding the new path and, for a rename,
          # the path it replaced: renaming a matched file out of the matched
          # paths removes a lint input just like editing it.
          row='[.filename, (.previous_filename // empty)] | @tsv'

          if [[ -n "${PR_NUMBER}" ]]; then
            # The PR files endpoint stops at 3000 files and pagination cannot
            # extend it, so cross-check against the count the PR itself reports.
            expected=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files') \
              || fail_open "Could not read the pull request."
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq ".[] | ${row}") \
              || fail_open "Could not resolve changed files."

            listed=$(count_rows "$rows")
            if [[ "$listed" -lt "$expected" ]]; then
              fail_open "GitHub listed only ${listed} of ${expected} changed files."
            fi
          else
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${GITHUB_SHA}" --jq ".files[]? | ${row}") \
              || fail_open "Could not resolve changed files."

            # The compare endpoint reports at most 300 files and pagination does
            # not extend that list, so a full list may be hiding native changes.
            listed=$(count_rows "$rows")
            if [[ "$listed" -ge 300 ]]; then
              fail_open "GitHub listed ${listed} changed files, the compare endpoint maximum."
            fi
          fi

          paths=$(tr '\t' '\n' <<< "$rows")

          # Sources scripts/mobile-native-static-check.ts lints, plus the tool
          # and rule configuration that decides how it lints them, plus the
          # root package.json that defines the lint:mobile command.
          native_pattern='^apps/mobile/.*\.(swift|kt|kts)$|^apps/mobile/(\.swiftlint\.yml|detekt\.yml|\.editorconfig|Brewfile)$|^scripts/mobile-native-static-check\.ts$|^package\.json$|^\.github/workflows/ci\.yml$'

          # Files that can change the generated Android project or the native
          # dependency graph. Ordinary mobile TypeScript stays on the faster
          # unit/typecheck path because assembling a debug APK does not add
          # useful coverage for JavaScript-only changes.
          android_pattern='^apps/mobile/app\.config\.ts$|^apps/mobile/package\.json$|^apps/mobile/(babel|metro|react-native)\.config\.[^/]+$|^apps/mobile/assets/|^apps/mobile/plugins/withAndroid.*\.cjs$|^apps/mobile/modules/[^/]+/(android/|expo-module\.config\.json$|react-native\.config\.[^/]+$|package\.json$|CMakeLists\.txt$)|^apps/mobile/.*\.(java|kt|kts|c|cc|cpp|h|hpp)$|^assets/|^patches/|^scripts/lib/(brand-assets|public-config)\.ts$|^package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^\.github/workflows/ci\.yml$'

          if grep -qE "$native_pattern" <<< "$paths"; then
            echo "Native sources or lint configuration changed:"
            grep -E "$native_pattern" <<< "$paths"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No mobile native sources or lint configuration changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -qE "$android_pattern" <<< "$paths"; then
            echo "Android native inputs changed:"
            grep -E "$android_pattern" <<< "$paths"
            echo "android_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Android native inputs changed."
            echo "android_changed=false" >> "$GITHUB_OUTPUT"
          fi

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    needs: mobile_native_changes
    # Skip only on an explicit "no": a gate job that failed or errored leaves the
    # output empty, and that must run the lint rather than silently skip it.
    if: ${{ !cancelled() && needs.mobile_native_changes.outputs.changed != 'false' }}
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  mobile_android_debug_build:
    name: Mobile Android Debug Build
    needs: mobile_native_changes
    # Skip only on an explicit "no". If diff detection fails, the gate emits
    # true; if the gate job itself errors, the empty output also fails open.
    if: ${{ !cancelled() && needs.mobile_native_changes.outputs.android_changed != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_VARIANT: development
      EXPO_NO_GIT_STATUS: 1
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Generate clean Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --clean --platform android

      - name: Assemble arm64 debug APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Verify debug APK
        run: test -f apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts
