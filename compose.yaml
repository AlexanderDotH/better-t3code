services:
  t3-server:
    build:
      context: .
      dockerfile: deploy/container/Dockerfile
    image: better-t3code-server:local
    restart: unless-stopped
    init: true
    read_only: true
    ports:
      - "${T3CODE_PORT:-3773}:3773"
    environment:
      T3CODE_ADVERTISED_URL: "${T3CODE_ADVERTISED_URL:-http://localhost:3773}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      CURSOR_API_KEY: "${CURSOR_API_KEY:-}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      GH_TOKEN: "${GH_TOKEN:-}"
      GITLAB_TOKEN: "${GITLAB_TOKEN:-}"
      AZURE_DEVOPS_EXT_PAT: "${AZURE_DEVOPS_EXT_PAT:-}"
      T3CODE_BITBUCKET_ACCESS_TOKEN: "${T3CODE_BITBUCKET_ACCESS_TOKEN:-}"
      T3CODE_BITBUCKET_EMAIL: "${T3CODE_BITBUCKET_EMAIL:-}"
      T3CODE_BITBUCKET_API_TOKEN: "${T3CODE_BITBUCKET_API_TOKEN:-}"
    volumes:
      - t3-data:/data
      - t3-home:/home/t3
      - "${T3_WORKSPACE:-.}:/workspace"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  t3-data:
  t3-home:
